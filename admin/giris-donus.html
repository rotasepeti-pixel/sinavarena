<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>SınavArena · Giriş</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F1F5F9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0F172A; }
  @media (prefers-color-scheme: dark) { body { background: #0B1220; color: #F8FAFC; } .kart { background: #111A2E !important; } p { color: #94A3B8 !important; } }
  .kart { background: #fff; border-radius: 24px; padding: 32px 24px; margin: 16px; max-width: 380px; width: 100%; box-sizing: border-box; text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12); }
  img { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { margin: 0 0 22px; color: #475569; line-height: 1.5; }
  a.dugme { display: block; padding: 16px; border-radius: 16px; background: #1D4ED8; color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
  .hata { color: #DC2626 !important; }
</style>
</head>
<body>
<div class="kart">
  <img src="./logo.svg" alt="">
  <h1 id="baslik">Giriş tamamlandı</h1>
  <p id="metin">Uygulamaya dönülüyor…</p>
  <a class="dugme" id="dugme" href="sinavarena://auth/callback">Uygulamaya dön</a>
</div>
<script>
  // Google girişinden sonra Supabase buraya döner (oturum bilgisi adresin # kısmında, sunucuya gitmez).
  // Sayfa bilgiyi olduğu gibi uygulamanın adresine taşır. Chrome otomatik geçişi engellerse
  // (ör. telefona yeni Google hesabı eklendikten sonra) kullanıcı düğmeye dokunarak döner.
  (function () {
    var ek = location.hash || (location.search ? '#' + location.search.slice(1) : '');
    var hedef = 'sinavarena://auth/callback' + ek;
    var dugme = document.getElementById('dugme');
    dugme.href = hedef;
    if (/error/.test(ek)) {
      document.getElementById('baslik').textContent = 'Giriş tamamlanamadı';
      var m = /error_description=([^&]*)/.exec(ek);
      var metin = document.getElementById('metin');
      metin.textContent = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : 'Lütfen uygulamaya dönüp yeniden dene.';
      metin.className = 'hata';
    }
    try { location.replace(hedef); } catch (e) {}
  })();
</script>
</body>
</html>
